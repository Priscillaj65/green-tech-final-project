<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | GreenTech Solutions</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="nav">
  <h1>GreenTech</h1>
  <div class="links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="products.html">Services</a>
    <a href="blog.html">Resources</a>
    <a class="active" href="contact.html">Contact</a>
  </div>
</header>

<section class="hero-green">
  <h2>Contact Us</h2>
  <p>We’d love to hear from you. Reach out with any questions or inquiries.</p>
</section>

<!-- CONTACT INFO -->
<section class="about-grid">

  <div class="block">
    <h3>📧 Email</h3>
    <p>support@greentech.com</p>
  </div>

  <div class="block">
    <h3>📞 Phone</h3>
    <p>(555) 123-4567</p>
  </div>

  <div class="block">
    <h3>📍 Address</h3>
    <p>123 Green Street<br>Eco City, EC 10001</p>
  </div>

</section>

<!-- CONTACT FORM -->
<section class="form-section">

  <h2>Send Us a Message</h2>

  <form class="contact-form">

    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Your Name" required>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Your Email" required>

    <label for="message">Message</label>
    <textarea id="message" rows="5" placeholder="Your Message" required></textarea>

    <button type="submit">Send Message</button>

  </form>

</section>

<footer>
  <p>© 2026 GreenTech Solutions</p>
</footer>

</body>
</html>
